# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
#
# Builds the WebAssembly version of the game, checks that it can be
# played on the 'Play' page and deploys the website with the game.
name: Create Zensical website


on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create_zensical_website.yaml
      - 'docs/**'
      - 'resources/**'
      - 'scripts/test_play_page.py'
      - 'src/**'
      - SpaceHarry.pro
      - zensical.toml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # A version of Qt only works with one version of Emscripten, see
  # https://doc.qt.io/qt-6/wasm.html#installing-emscripten
  QT_VERSION: 6.8.3
  EMSCRIPTEN_VERSION: 3.1.56

jobs:
  build_wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          cache: true

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - run: qmake SpaceHarry.pro
      - run: make --silent

      - name: Collect the files needed to run the game
        run: |
          mkdir wasm
          cp SpaceHarry.html SpaceHarry.js SpaceHarry.wasm qtloader.js qtlogo.svg wasm/

      - uses: actions/upload-artifact@v4
        with:
          name: space_harry_wasm
          path: wasm
          if-no-files-found: error

  test_play_page:
    needs: build_wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: space_harry_wasm
          path: docs/game

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: pip install pillow playwright zensical
      - run: playwright install --with-deps chromium
      - run: zensical build --clean --strict

      - name: Play the game on the website
        run: |
          python -m http.server 8000 --directory site &
          sleep 1
          python scripts/test_play_page.py http://localhost:8000/play/

  create_zensical_website:
    needs: test_play_page
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: space_harry_wasm
          path: docs/game
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
